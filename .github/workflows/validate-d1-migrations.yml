name: Validate D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-d1-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 53fe9d5894a4fa5721e7258f2103cd982910890c
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check production migration receipts (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72
        run: scripts/check-d1-migrations.sh --env tk --remote
